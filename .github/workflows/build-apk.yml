name: Build BANABLAST Native APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Prepare Web Assets & Install Dependencies
        run: |
          mkdir -p www
          cp billing.html index.html logo.png manifest.json www/ 2>/dev/null || true
          npm install
          npx cap add android

      - name: Add Bluetooth Permissions
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />' android/app/src/main/AndroidManifest.xml

      - name: Set Custom BANABLAST App Icon
        run: |
          python3 -m pip install Pillow --quiet
          python3 - << 'EOF'
          import os
          from PIL import Image

          logo_path = 'logo.png'
          if not os.path.exists(logo_path):
              print("logo.png not found!")
              exit(0)

          img = Image.open(logo_path).convert('RGBA')
          res_path = 'android/app/src/main/res'

          densities = {
              'mipmap-mdpi': (48, 108),
              'mipmap-hdpi': (72, 162),
              'mipmap-xhdpi': (96, 216),
              'mipmap-xxhdpi': (144, 324),
              'mipmap-xxxhdpi': (192, 432)
          }

          for folder, (size, fg_size) in densities.items():
              target_dir = os.path.join(res_path, folder)
              os.makedirs(target_dir, exist_ok=True)
              resized = img.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(os.path.join(target_dir, 'ic_launcher.png'))
              resized.save(os.path.join(target_dir, 'ic_launcher_round.png'))
              fg = Image.new('RGBA', (fg_size, fg_size), (0, 0, 0, 0))
              inner = int(fg_size * 0.72)
              logo_inner = img.resize((inner, inner), Image.Resampling.LANCZOS)
              offset = (fg_size - inner) // 2
              fg.paste(logo_inner, (offset, offset), logo_inner)
              fg.save(os.path.join(target_dir, 'ic_launcher_foreground.png'))

          print("Custom Banana logo set successfully!")
          EOF

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Debug APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: BANABLAST-POS-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
